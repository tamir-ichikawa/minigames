<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRA PATROL - Protect the Stars</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
}
canvas {
  display: block;
  image-rendering: auto;
}
#loading {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: #0a0e1a; color: #7ec8e3; font-size: 24px; z-index: 100;
}
#loading .bar { width: 300px; height: 6px; background: #1a2040; border-radius: 3px; margin-top: 20px; }
#loading .fill { height: 100%; background: #4af; border-radius: 3px; transition: width 0.2s; }
</style>
</head>
<body>
<div id="loading">
  <div>ASTRA PATROL</div>
  <div style="font-size:14px; margin-top:8px; color:#4a7a9a;">Loading assets...</div>
  <div class="bar"><div class="fill" id="loadbar" style="width:0%"></div></div>
</div>
<canvas id="game"></canvas>

<script>
// ============================================================
// ASTRA PATROL - HTML5 Shooting Game
// ============================================================

const CANVAS_W = 480, CANVAS_H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

// Scale canvas to fit screen
function resizeCanvas() {
  const ratio = CANVAS_W / CANVAS_H;
  let w = window.innerWidth, h = window.innerHeight;
  if (w / h > ratio) { canvas.style.height = h + 'px'; canvas.style.width = (h * ratio) + 'px'; }
  else { canvas.style.width = w + 'px'; canvas.style.height = (w / ratio) + 'px'; }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============================================================
// Asset Loading
// ============================================================
const images = {};
const assetList = [
  ['player', 'sprites/01_player_standard.png'],
  ['player_speed', 'sprites/02_player_speed.png'],
  ['player_power', 'sprites/03_player_power.png'],
  ['enemy_core', 'sprites/04_enemy_core_fighter.png'],
  ['enemy_scout', 'sprites/05_enemy_scout_drone.png'],
  ['enemy_laser', 'sprites/06_enemy_laser_ship.png'],
  ['enemy_bat', 'sprites/07_enemy_fire_bat.png'],
  ['enemy_tank', 'sprites/08_enemy_armored_tank.png'],
  ['enemy_float', 'sprites/09_enemy_float_unit.png'],
  ['boss', 'sprites/10_boss_nebula_core.png'],
  ['boss_side', 'sprites/11_boss_side.png'],
  ['boss_explode', 'sprites/12_boss_explosion.png'],
  ['shot', 'sprites/13_shot_blue.png'],
  ['shot_wide', 'sprites/14_shot_wide.png'],
  ['laser', 'sprites/15_laser_blue.png'],
  ['missile', 'sprites/16_missile_blue.png'],
  ['burst', 'sprites/17_burst_blue.png'],
  ['thruster', 'sprites/18_thruster_blue.png'],
  ['bullet_red', 'sprites/19_bullet_red.png'],
  ['bullet_purple', 'sprites/20_bullet_purple.png'],
  ['bullet_orange', 'sprites/21_bullet_orange.png'],
  ['bullet_cyan', 'sprites/22_bullet_cyan.png'],
  ['missile_pink', 'sprites/23_missile_pink.png'],
  ['orb', 'sprites/24_orb_purple.png'],
  ['sm_core', 'sprites/25_small_core_fighter.png'],
  ['sm_scout', 'sprites/26_small_scout_drone.png'],
  ['sm_laser', 'sprites/27_small_laser_ship.png'],
  ['sm_bat', 'sprites/28_small_fire_bat.png'],
  ['sm_tank', 'sprites/29_small_armored_tank.png'],
  ['sm_float', 'sprites/30_small_float_unit.png'],
  ['atk_radial', 'sprites/31_attack_radial.png'],
  ['atk_ring', 'sprites/32_attack_ring.png'],
  ['laser_purple', 'sprites/33_laser_purple.png'],
  ['impact', 'sprites/34_impact_pink.png'],
  ['explosion', 'sprites/35_explosion_orange.png'],
  ['player_small', 'sprites/36_player_small.png'],
];

let loaded = 0;
function loadAssets() {
  return new Promise(resolve => {
    const total = assetList.length;
    assetList.forEach(([name, src]) => {
      const img = new Image();
      img.onload = () => {
        images[name] = img;
        loaded++;
        document.getElementById('loadbar').style.width = (loaded / total * 100) + '%';
        if (loaded === total) {
          document.getElementById('loading').style.display = 'none';
          resolve();
        }
      };
      img.onerror = () => {
        console.warn('Failed to load:', src);
        loaded++;
        if (loaded === total) { document.getElementById('loading').style.display = 'none'; resolve(); }
      };
      img.src = src;
    });
  });
}

// ============================================================
// Input
// ============================================================
const keys = {};
const touch = { active: false, x: 0, y: 0, prevX: 0, prevY: 0, shoot: false };
let clickedThisFrame = false;

document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  touch.active = true;
  touch.x = (e.touches[0].clientX - rect.left) * scaleX;
  touch.y = (e.touches[0].clientY - rect.top) * scaleY;
  touch.prevX = touch.x;
  touch.prevY = touch.y;
  touch.shoot = true;
  clickedThisFrame = true;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  touch.prevX = touch.x;
  touch.prevY = touch.y;
  touch.x = (e.touches[0].clientX - rect.left) * scaleX;
  touch.y = (e.touches[0].clientY - rect.top) * scaleY;
}, { passive: false });

canvas.addEventListener('touchend', e => { e.preventDefault(); touch.active = false; touch.shoot = false; }, { passive: false });

// Mouse support
let mouseDown = false;
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  mouseDown = true;
  touch.active = true;
  clickedThisFrame = true;
  touch.x = (e.clientX - rect.left) * scaleX;
  touch.y = (e.clientY - rect.top) * scaleY;
  touch.prevX = touch.x;
  touch.prevY = touch.y;
  touch.shoot = true;
});
canvas.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  touch.prevX = touch.x;
  touch.prevY = touch.y;
  touch.x = (e.clientX - rect.left) * scaleX;
  touch.y = (e.clientY - rect.top) * scaleY;
});
canvas.addEventListener('mouseup', () => { mouseDown = false; touch.active = false; touch.shoot = false; });

// ============================================================
// Sound (simple web audio synth)
// ============================================================
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const t = audioCtx.currentTime;

  if (type === 'shoot') {
    osc.type = 'square'; osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(440, t + 0.05);
    gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    osc.start(t); osc.stop(t + 0.08);
  } else if (type === 'hit') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t);
    osc.frequency.exponentialRampToValueAtTime(60, t + 0.15);
    gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.start(t); osc.stop(t + 0.15);
  } else if (type === 'explode') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(20, t + 0.4);
    gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.start(t); osc.stop(t + 0.4);
  } else if (type === 'powerup') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(523, t);
    osc.frequency.setValueAtTime(659, t + 0.08);
    osc.frequency.setValueAtTime(784, t + 0.16);
    gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.start(t); osc.stop(t + 0.3);
  } else if (type === 'boss') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.6);
    gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    osc.start(t); osc.stop(t + 0.6);
  } else if (type === 'death') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 0.8);
    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    osc.start(t); osc.stop(t + 0.8);
  }
}

// ============================================================
// Stars background
// ============================================================
const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * CANVAS_W,
    y: Math.random() * CANVAS_H,
    speed: 0.3 + Math.random() * 2,
    size: 0.5 + Math.random() * 1.5,
    brightness: 0.3 + Math.random() * 0.7
  });
}

function updateStars() {
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > CANVAS_H) { s.y = 0; s.x = Math.random() * CANVAS_W; }
  });
}

function drawStars() {
  stars.forEach(s => {
    ctx.fillStyle = `rgba(180, 200, 255, ${s.brightness})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
}

// ============================================================
// Particles
// ============================================================
const particles = [];

function spawnParticles(x, y, color, count, speed, life) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: life || 30,
      maxLife: life || 30,
      color,
      size: 1 + Math.random() * 3
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

// ============================================================
// Draw sprite helper
// ============================================================
function drawSprite(img, x, y, w, h, rot) {
  if (!img) return;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
}

// ============================================================
// Game State
// ============================================================
let gameState = 'title'; // title, playing, gameover, victory
let score = 0, highScore = parseInt(localStorage.getItem('astra_hi') || '0');
let lives = 3;
let weaponLevel = 1;
let weaponType = 0; // 0=normal, 1=wide, 2=laser, 3=missile
const weaponNames = ['NORMAL', 'WIDE', 'LASER', 'MISSILE'];
let shakeTimer = 0;
let wave = 0;
let waveTimer = 0;
let bossActive = false;
let gameTime = 0;
let invincibleTimer = 0;
let comboCount = 0;
let comboTimer = 0;
let showWaveText = 0;
let waveTextStr = '';
let hitFlashTimer = 0;  // Red flash on hit
let deathAnimTimer = 0; // Death explosion animation

// ============================================================
// Player
// ============================================================
const player = { x: CANVAS_W / 2, y: CANVAS_H - 100, w: 48, h: 55, shootCD: 0 };

function updatePlayer(dt) {
  const speed = 5;

  // Keyboard
  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += speed;
  if (keys['ArrowUp'] || keys['KeyW']) player.y -= speed;
  if (keys['ArrowDown'] || keys['KeyS']) player.y += speed;

  // Touch / Mouse
  if (touch.active) {
    const dx = touch.x - touch.prevX;
    const dy = touch.y - touch.prevY;
    player.x += dx;
    player.y += dy;
    touch.prevX = touch.x;
    touch.prevY = touch.y;
  }

  // Bounds
  player.x = Math.max(player.w / 2, Math.min(CANVAS_W - player.w / 2, player.x));
  player.y = Math.max(player.h / 2, Math.min(CANVAS_H - player.h / 2, player.y));

  // Shooting
  player.shootCD--;
  const shooting = keys['Space'] || keys['KeyZ'] || touch.active;
  if (shooting && player.shootCD <= 0) {
    firePlayerBullet();
    player.shootCD = weaponType === 2 ? 3 : weaponType === 3 ? 15 : 8;
    playSound('shoot');
  }

  if (invincibleTimer > 0) invincibleTimer--;
  if (comboTimer > 0) { comboTimer--; if (comboTimer <= 0) comboCount = 0; }
}

function drawPlayer() {
  if (invincibleTimer > 0 && Math.floor(invincibleTimer / 3) % 2 === 0) return;

  // Thruster
  const thrW = 20, thrH = 25;
  const thrY = player.y + player.h / 2 - 5;
  const flicker = Math.sin(gameTime * 0.5) * 3;
  if (images.thruster) {
    ctx.globalAlpha = 0.7 + Math.sin(gameTime * 0.3) * 0.3;
    drawSprite(images.thruster, player.x - player.w / 4, thrY + flicker, thrW, thrH + flicker);
    drawSprite(images.thruster, player.x + player.w / 4, thrY + flicker, thrW, thrH + flicker);
    ctx.globalAlpha = 1;
  }

  const sprites = [images.player, images.player, images.player_speed, images.player_power];
  const img = sprites[weaponType] || images.player;

  // Damage tint based on lives
  if (lives <= 1) {
    // Heavy damage: red tint + smoke particles
    ctx.globalAlpha = 0.9;
    drawSprite(img, player.x, player.y, player.w, player.h);
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255, 60, 0, 0.35)';
    ctx.fillRect(player.x - player.w / 2, player.y - player.h / 2, player.w, player.h);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    // Smoke trail
    if (gameTime % 3 === 0) {
      spawnParticles(player.x + (Math.random() - 0.5) * 20, player.y + (Math.random() - 0.5) * 10, '#555', 1, 1.5, 20);
      spawnParticles(player.x + (Math.random() - 0.5) * 15, player.y - 5, '#f84', 1, 1, 12);
    }
  } else if (lives <= 2) {
    // Light damage: slight tint + occasional sparks
    drawSprite(img, player.x, player.y, player.w, player.h);
    if (gameTime % 8 === 0) {
      spawnParticles(player.x + (Math.random() - 0.5) * 20, player.y + 10, '#888', 1, 1, 15);
    }
  } else {
    // Full health: normal
    drawSprite(img, player.x, player.y, player.w, player.h);
  }
}

// ============================================================
// Player Bullets
// ============================================================
const playerBullets = [];

function firePlayerBullet() {
  const x = player.x, y = player.y - player.h / 2;

  if (weaponType === 0) { // Normal
    const lvl = weaponLevel;
    playerBullets.push({ x, y, vx: 0, vy: -10, w: 40, h: 64, dmg: 1, img: 'shot' });
    if (lvl >= 2) {
      playerBullets.push({ x: x - 14, y: y + 5, vx: -0.5, vy: -10, w: 40, h: 64, dmg: 1, img: 'shot' });
      playerBullets.push({ x: x + 14, y: y + 5, vx: 0.5, vy: -10, w: 40, h: 64, dmg: 1, img: 'shot' });
    }
    if (lvl >= 3) {
      playerBullets.push({ x: x - 24, y: y + 10, vx: -1.5, vy: -9, w: 40, h: 64, dmg: 1, img: 'shot' });
      playerBullets.push({ x: x + 24, y: y + 10, vx: 1.5, vy: -9, w: 40, h: 64, dmg: 1, img: 'shot' });
    }
  } else if (weaponType === 1) { // Wide
    const spread = weaponLevel >= 3 ? 7 : weaponLevel >= 2 ? 5 : 3;
    for (let i = 0; i < spread; i++) {
      const angle = -Math.PI / 2 + (i - (spread - 1) / 2) * 0.15;
      playerBullets.push({ x, y, vx: Math.cos(angle) * 9, vy: Math.sin(angle) * 9, w: 48, h: 52, dmg: 0.8, img: 'shot_wide' });
    }
  } else if (weaponType === 2) { // Laser - much thicker beam
    const w = weaponLevel >= 3 ? 100 : weaponLevel >= 2 ? 76 : 56;
    playerBullets.push({ x, y, vx: 0, vy: -15, w, h: 140, dmg: 0.5, img: 'laser', pierce: true });
  } else if (weaponType === 3) { // Missile - larger and more visible
    const cnt = weaponLevel >= 3 ? 4 : weaponLevel >= 2 ? 3 : 2;
    for (let i = 0; i < cnt; i++) {
      const ox = (i - (cnt - 1) / 2) * 22;
      playerBullets.push({ x: x + ox, y, vx: ox * 0.1, vy: -6, w: 56, h: 88, dmg: 3, img: 'missile', homing: true });
    }
  }
}

function updatePlayerBullets() {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];

    if (b.homing && enemies.length > 0) {
      let closest = null, minD = Infinity;
      enemies.forEach(e => {
        const d = Math.hypot(e.x - b.x, e.y - b.y);
        if (d < minD) { minD = d; closest = e; }
      });
      if (closest && minD < 300) {
        const angle = Math.atan2(closest.y - b.y, closest.x - b.x);
        b.vx += Math.cos(angle) * 0.5;
        b.vy += Math.sin(angle) * 0.5;
        const spd = Math.hypot(b.vx, b.vy);
        if (spd > 8) { b.vx = b.vx / spd * 8; b.vy = b.vy / spd * 8; }
      }
    }

    b.x += b.vx;
    b.y += b.vy;
    if (b.y < -30 || b.y > CANVAS_H + 30 || b.x < -30 || b.x > CANVAS_W + 30) {
      playerBullets.splice(i, 1);
    }
  }
}

function drawPlayerBullets() {
  playerBullets.forEach(b => {
    const img = images[b.img];
    if (img) {
      const rot = b.img === 'missile' ? Math.atan2(b.vy, b.vx) + Math.PI / 2 : 0;
      drawSprite(img, b.x, b.y, b.w, b.h, rot);
    } else {
      ctx.fillStyle = '#4af';
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }
  });
}

// ============================================================
// Enemies
// ============================================================
const enemies = [];
const enemyBullets = [];

const ENEMY_TYPES = {
  core: { img: 'enemy_core', w: 44, h: 40, hp: 3, score: 100, speed: 1.8, shootRate: 150, bulletImg: 'bullet_red' },
  scout: { img: 'enemy_scout', w: 40, h: 42, hp: 2, score: 80, speed: 3, shootRate: 220, bulletImg: 'bullet_cyan' },
  laser_ship: { img: 'enemy_laser', w: 42, h: 48, hp: 5, score: 150, speed: 1.3, shootRate: 100, bulletImg: 'bullet_purple' },
  bat: { img: 'enemy_bat', w: 48, h: 38, hp: 4, score: 120, speed: 2.2, shootRate: 120, bulletImg: 'bullet_orange' },
  tank: { img: 'enemy_tank', w: 50, h: 46, hp: 8, score: 200, speed: 0.8, shootRate: 80, bulletImg: 'bullet_red' },
  float: { img: 'enemy_float', w: 36, h: 40, hp: 3, score: 90, speed: 1.8, shootRate: 180, bulletImg: 'bullet_cyan' },
};

function spawnEnemy(type, x, y, pattern) {
  const et = ENEMY_TYPES[type];
  enemies.push({
    type, x: x || Math.random() * (CANVAS_W - 60) + 30, y: y || -50,
    w: et.w, h: et.h, hp: et.hp + Math.floor(wave * 0.5),
    maxHp: et.hp + Math.floor(wave * 0.5),
    score: et.score, speed: et.speed,
    shootRate: et.shootRate, shootCD: Math.random() * et.shootRate,
    bulletImg: et.bulletImg, img: et.img,
    pattern: pattern || 'straight',
    time: 0, startX: x || CANVAS_W / 2,
    dropItem: Math.random() < 0.15
  });
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.time++;

    // Movement patterns
    if (e.pattern === 'straight') {
      e.y += e.speed;
    } else if (e.pattern === 'sine') {
      e.y += e.speed;
      e.x = e.startX + Math.sin(e.time * 0.03) * 80;
    } else if (e.pattern === 'zigzag') {
      e.y += e.speed * 0.8;
      e.x += Math.sin(e.time * 0.05) * 3;
    } else if (e.pattern === 'swoop') {
      if (e.time < 60) { e.y += e.speed * 1.5; }
      else if (e.time < 120) { e.x += (e.x < CANVAS_W / 2 ? -1 : 1) * -2; e.y += 0.5; }
      else { e.y += e.speed; }
    } else if (e.pattern === 'hover') {
      if (e.y < 120) e.y += e.speed;
      else e.x += Math.sin(e.time * 0.02) * 1.5;
    }

    // Shooting
    e.shootCD--;
    if (e.shootCD <= 0 && e.y > 0 && e.y < CANVAS_H - 100) {
      e.shootCD = e.shootRate;
      const angle = Math.atan2(player.y - e.y, player.x - e.x);

      if (e.type === 'laser_ship') {
        // Triple shot
        for (let a = -0.2; a <= 0.2; a += 0.2) {
          enemyBullets.push({ x: e.x, y: e.y + e.h / 2, vx: Math.cos(angle + a) * 3, vy: Math.sin(angle + a) * 3, w: 32, h: 32, img: e.bulletImg });
        }
      } else if (e.type === 'tank') {
        // Spread shot
        for (let a = -0.4; a <= 0.4; a += 0.2) {
          enemyBullets.push({ x: e.x, y: e.y + e.h / 2, vx: Math.cos(angle + a) * 2.5, vy: Math.sin(angle + a) * 2.5, w: 32, h: 32, img: e.bulletImg });
        }
      } else {
        enemyBullets.push({ x: e.x, y: e.y + e.h / 2, vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3, w: 28, h: 28, img: e.bulletImg });
      }
    }

    // Remove if off screen
    if (e.y > CANVAS_H + 60 || e.x < -60 || e.x > CANVAS_W + 60) {
      enemies.splice(i, 1);
    }
  }
}

function drawEnemies() {
  enemies.forEach(e => {
    const img = images[e.img];
    drawSprite(img, e.x, e.y, e.w, e.h, Math.PI); // Rotated 180 to face down

    // HP bar
    if (e.hp < e.maxHp) {
      const bw = e.w * 0.8;
      ctx.fillStyle = '#300';
      ctx.fillRect(e.x - bw / 2, e.y - e.h / 2 - 8, bw, 3);
      ctx.fillStyle = '#f44';
      ctx.fillRect(e.x - bw / 2, e.y - e.h / 2 - 8, bw * (e.hp / e.maxHp), 3);
    }
  });
}

function updateEnemyBullets() {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > CANVAS_H + 20 || b.y < -20 || b.x < -20 || b.x > CANVAS_W + 20) {
      enemyBullets.splice(i, 1);
    }
  }
}

function drawEnemyBullets() {
  enemyBullets.forEach(b => {
    const img = images[b.img];
    if (img) drawSprite(img, b.x, b.y, b.w, b.h);
    else { ctx.fillStyle = '#f44'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill(); }
  });
}

// ============================================================
// Boss
// ============================================================
let boss = null;

function spawnBoss() {
  bossActive = true;
  playSound('boss');
  waveTextStr = '⚠ WARNING - BOSS APPROACHING ⚠';
  showWaveText = 180;
  boss = {
    x: CANVAS_W / 2, y: -80,
    w: 120, h: 130,
    hp: 80 + wave * 20, maxHp: 80 + wave * 20,
    phase: 0, time: 0,
    entering: true,
    shootCD: 0, attackPattern: 0
  };
}

function updateBoss() {
  if (!boss) return;
  boss.time++;

  if (boss.entering) {
    boss.y += 1;
    if (boss.y >= 100) { boss.entering = false; boss.time = 0; }
    return;
  }

  // Movement
  boss.x = CANVAS_W / 2 + Math.sin(boss.time * 0.015) * 150;
  boss.y = 100 + Math.sin(boss.time * 0.01) * 30;

  // Phase transitions
  const hpRatio = boss.hp / boss.maxHp;
  boss.phase = hpRatio > 0.6 ? 0 : hpRatio > 0.3 ? 1 : 2;

  // Shooting patterns
  boss.shootCD--;
  if (boss.shootCD <= 0) {
    boss.attackPattern = (boss.attackPattern + 1) % 4;

    if (boss.attackPattern === 0) {
      // Radial burst
      const count = 8 + boss.phase * 4;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + boss.time * 0.01;
        enemyBullets.push({ x: boss.x, y: boss.y + 40, vx: Math.cos(angle) * 2.5, vy: Math.sin(angle) * 2.5, w: 32, h: 32, img: 'bullet_purple' });
      }
      boss.shootCD = 40 - boss.phase * 10;
    } else if (boss.attackPattern === 1) {
      // Aimed shots
      const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
      for (let i = -2; i <= 2; i++) {
        enemyBullets.push({ x: boss.x, y: boss.y + 50, vx: Math.cos(angle + i * 0.1) * 4, vy: Math.sin(angle + i * 0.1) * 4, w: 36, h: 36, img: 'bullet_red' });
      }
      boss.shootCD = 30 - boss.phase * 5;
    } else if (boss.attackPattern === 2) {
      // Side lasers
      for (let s = -1; s <= 1; s += 2) {
        for (let i = 0; i < 3; i++) {
          enemyBullets.push({ x: boss.x + s * 50, y: boss.y + 30, vx: s * 1, vy: 3 + i * 0.5, w: 28, h: 48, img: 'bullet_cyan' });
        }
      }
      boss.shootCD = 20 - boss.phase * 5;
    } else {
      // Spiral
      const count = 3 + boss.phase * 2;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + boss.time * 0.05;
        enemyBullets.push({ x: boss.x, y: boss.y + 40, vx: Math.cos(angle) * 2, vy: Math.sin(angle) * 2 + 1, w: 40, h: 40, img: 'orb' });
      }
      boss.shootCD = 15;
    }
  }
}

function drawBoss() {
  if (!boss) return;

  // Glow effect
  ctx.save();
  ctx.globalAlpha = 0.3 + Math.sin(gameTime * 0.1) * 0.1;
  const grad = ctx.createRadialGradient(boss.x, boss.y, 20, boss.x, boss.y, 100);
  grad.addColorStop(0, 'rgba(128, 0, 255, 0.4)');
  grad.addColorStop(1, 'rgba(128, 0, 255, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(boss.x - 100, boss.y - 100, 200, 200);
  ctx.globalAlpha = 1;
  ctx.restore();

  const hpRatio = boss.hp / boss.maxHp;
  const shake = hpRatio < 0.3 ? (Math.random() - 0.5) * 4 : 0;

  drawSprite(images.boss, boss.x + shake, boss.y + shake, boss.w, boss.h);

  // HP bar at top
  const bw = CANVAS_W * 0.7;
  const bx = (CANVAS_W - bw) / 2;
  ctx.fillStyle = '#200020';
  ctx.fillRect(bx, 15, bw, 10);
  ctx.fillStyle = hpRatio > 0.5 ? '#a040ff' : hpRatio > 0.25 ? '#ff4040' : '#ff0000';
  ctx.fillRect(bx, 15, bw * hpRatio, 10);
  ctx.strokeStyle = '#604080';
  ctx.strokeRect(bx, 15, bw, 10);
  ctx.fillStyle = '#fff';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('NEBULA CORE', CANVAS_W / 2, 12);
}

// Power-ups
// ============================================================
const powerups = [];

function spawnPowerup(x, y) {
  const type = Math.random() < 0.4 ? 'weapon' : 'upgrade';
  powerups.push({
    x, y, w: 20, h: 20,
    vy: 1.5,
    type,
    weaponType: Math.floor(Math.random() * 4),
    time: 0
  });
}

function updatePowerups() {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy;
    p.time++;
    if (p.y > CANVAS_H + 30) { powerups.splice(i, 1); continue; }

    // Collision with player
    if (Math.abs(p.x - player.x) < 25 && Math.abs(p.y - player.y) < 25) {
      if (p.type === 'weapon') {
        weaponType = p.weaponType;
        weaponLevel = 1;
      } else {
        weaponLevel = Math.min(3, weaponLevel + 1);
      }
      playSound('powerup');
      spawnParticles(p.x, p.y, '#4f4', 10, 3, 20);
      powerups.splice(i, 1);
    }
  }
}

function drawPowerups() {
  powerups.forEach(p => {
    const pulse = Math.sin(p.time * 0.1) * 3;
    const colors = ['#44aaff', '#44ff44', '#ff44ff', '#ffaa44'];
    ctx.save();
    ctx.translate(p.x, p.y);

    // Glow
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = p.type === 'weapon' ? colors[p.weaponType] : '#ff4';
    ctx.beginPath();
    ctx.arc(0, 0, 14 + pulse, 0, Math.PI * 2);
    ctx.fill();

    // Icon
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(-6, -6, 12, 12);
    ctx.fillStyle = p.type === 'weapon' ? colors[p.weaponType] : '#ff4';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.type === 'weapon' ? 'W' : '▲', 0, 0);
    ctx.restore();
  });
}

// ============================================================
// Collisions
// ============================================================
function checkCollisions() {
  // Player bullets vs enemies
  for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
    const b = playerBullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (Math.abs(b.x - e.x) < (b.w + e.w) / 2 && Math.abs(b.y - e.y) < (b.h + e.h) / 2) {
        e.hp -= b.dmg;
        if (!b.pierce) { playerBullets.splice(bi, 1); }
        spawnParticles(b.x, b.y, '#8cf', 3, 2, 10);

        if (e.hp <= 0) {
          score += e.score * (1 + Math.floor(comboCount / 5) * 0.5);
          comboCount++;
          comboTimer = 120;
          spawnParticles(e.x, e.y, '#fa4', 15, 4, 25);
          spawnParticles(e.x, e.y, '#fff', 8, 3, 15);
          playSound('explode');
          if (e.dropItem) spawnPowerup(e.x, e.y);
          enemies.splice(ei, 1);
          shakeTimer = 5;
        } else {
          playSound('hit');
        }
        break;
      }
    }

    // Player bullets vs boss
    if (boss && !boss.entering && bi < playerBullets.length) {
      const b2 = playerBullets[bi];
      if (b2 && Math.abs(b2.x - boss.x) < (b2.w + boss.w) / 2 && Math.abs(b2.y - boss.y) < (b2.h + boss.h) / 2) {
        boss.hp -= b2.dmg;
        if (!b2.pierce) playerBullets.splice(bi, 1);
        spawnParticles(b2.x, b2.y, '#c4f', 3, 2, 10);
        playSound('hit');

        if (boss.hp <= 0) {
          score += 5000 * (wave + 1);
          spawnParticles(boss.x, boss.y, '#fa4', 40, 6, 40);
          spawnParticles(boss.x, boss.y, '#fff', 20, 5, 30);
          spawnParticles(boss.x, boss.y, '#c4f', 30, 5, 35);
          playSound('explode');
          shakeTimer = 20;
          boss = null;
          bossActive = false;
          wave++;
          waveTimer = 180;
          if (wave >= 5) {
            gameState = 'victory';
          }
        }
      }
    }
  }

  // Enemy bullets vs player
  if (invincibleTimer <= 0) {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      if (Math.abs(b.x - player.x) < (b.w + player.w * 0.3) / 2 &&
          Math.abs(b.y - player.y) < (b.h + player.h * 0.3) / 2) {
        playerHit();
        enemyBullets.splice(i, 1);
        break;
      }
    }

    // Enemies vs player
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (Math.abs(e.x - player.x) < (e.w + player.w) * 0.4 &&
          Math.abs(e.y - player.y) < (e.h + player.h) * 0.4) {
        playerHit();
        e.hp -= 5;
        if (e.hp <= 0) {
          spawnParticles(e.x, e.y, '#fa4', 15, 4, 25);
          enemies.splice(i, 1);
        }
        break;
      }
    }
  }
}

function playerHit() {
  lives--;
  playSound('death');
  spawnParticles(player.x, player.y, '#f84', 25, 5, 30);
  spawnParticles(player.x, player.y, '#fff', 15, 4, 20);
  shakeTimer = 15;
  hitFlashTimer = 15; // Red screen flash
  invincibleTimer = 120;
  weaponLevel = Math.max(1, weaponLevel - 1);

  if (lives <= 0) {
    // Death explosion sequence
    deathAnimTimer = 90;
    spawnParticles(player.x, player.y, '#fa4', 40, 7, 50);
    spawnParticles(player.x, player.y, '#ff0', 30, 6, 40);
    spawnParticles(player.x, player.y, '#fff', 20, 5, 35);
    spawnParticles(player.x - 15, player.y + 10, '#f44', 15, 5, 30);
    spawnParticles(player.x + 15, player.y - 10, '#f84', 15, 5, 30);
    playSound('explode');
    shakeTimer = 30;
    // Delay game over to show explosion
    setTimeout(() => {
      gameState = 'gameover';
      if (score > highScore) { highScore = score; localStorage.setItem('astra_hi', highScore.toString()); }
    }, 1500);
  }
}

          setTimeout(() => {

function drawHUD() {
  // Score
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${Math.floor(score).toLocaleString()}`, 10, 30);

  // Hi Score
  ctx.font = '11px monospace';
  ctx.fillStyle = '#8af';
  ctx.fillText(`HI: ${highScore.toLocaleString()}`, 10, 46);

  // Lives — ship icons + HP bar
  ctx.textAlign = 'right';
  for (let i = 0; i < lives; i++) {
    if (images.player_small) {
      drawSprite(images.player_small, CANVAS_W - 30 - i * 28, 35, 22, 25);
    }
  }
  // Player HP bar under lives
  const hpBarW = 80, hpBarH = 6;
  const hpBarX = CANVAS_W - 10 - hpBarW, hpBarY = 52;
  ctx.fillStyle = '#400';
  ctx.fillRect(hpBarX, hpBarY, hpBarW, hpBarH);
  const hpColors = ['#f00', '#f80', '#4f4'];
  ctx.fillStyle = lives >= 3 ? hpColors[2] : lives === 2 ? hpColors[1] : hpColors[0];
  ctx.fillRect(hpBarX, hpBarY, hpBarW * (lives / 3), hpBarH);
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1;
  ctx.strokeRect(hpBarX, hpBarY, hpBarW, hpBarH);
  ctx.fillStyle = '#ccc';
  ctx.font = '9px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`HP ${lives}/3`, CANVAS_W - 10, hpBarY + hpBarH + 11);

  // Weapon
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px monospace';
  ctx.fillStyle = '#4f4';
  ctx.fillText(`${weaponNames[weaponType]} Lv.${weaponLevel}`, 10, CANVAS_H - 15);

  // Wave
  ctx.textAlign = 'right';
  ctx.fillStyle = '#aaa';
  ctx.font = '11px monospace';
  ctx.fillText(`WAVE ${wave + 1}`, CANVAS_W - 10, CANVAS_H - 15);

  // Combo
  if (comboCount > 2) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = `hsl(${comboCount * 20}, 100%, 70%)`;
    ctx.globalAlpha = Math.min(1, comboTimer / 30);
    ctx.fillText(`${comboCount} COMBO! x${(1 + Math.floor(comboCount / 5) * 0.5).toFixed(1)}`, CANVAS_W / 2, CANVAS_H - 40);
    ctx.globalAlpha = 1;
  }

  // Wave text
  if (showWaveText > 0) {
    showWaveText--;
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px monospace';
    const alpha = showWaveText > 100 ? 1 : showWaveText / 100;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = waveTextStr.includes('WARNING') ? '#f44' : '#fff';
    ctx.fillText(waveTextStr, CANVAS_W / 2, CANVAS_H / 2 - 50);
    ctx.globalAlpha = 1;
  }
}

  // Player ship preview
  if (images.player) {
    drawSprite(images.player, CANVAS_W / 2, 380, 80, 92);
  }

  // Instructions
  ctx.font = '14px monospace';
  ctx.fillStyle = '#aaa';
  const blink = Math.sin(gameTime * 0.08) > 0;
  if (blink) {
    ctx.fillStyle = '#fff';
    ctx.fillText('PRESS SPACE / TAP TO START', CANVAS_W / 2, 500);
  }

  ctx.font = '11px monospace';
  ctx.fillStyle = '#666';
  ctx.fillText('Arrow Keys / WASD: Move', CANVAS_W / 2, 550);
  ctx.fillText('Space / Z: Shoot', CANVAS_W / 2, 568);
  ctx.fillText('Touch: Drag to move, auto-shoot', CANVAS_W / 2, 586);

  ctx.fillStyle = '#444';
  ctx.fillText('© ASTRA PATROL by umemura', CANVAS_W / 2, 660);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.textAlign = 'center';
  ctx.font = 'bold 36px monospace';
  ctx.fillStyle = '#f44';
  ctx.fillText('GAME OVER', CANVAS_W / 2, 280);

  ctx.font = '18px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(`SCORE: ${Math.floor(score).toLocaleString()}`, CANVAS_W / 2, 340);

  if (score >= highScore) {
    ctx.fillStyle = '#ff4';
    ctx.fillText('NEW HIGH SCORE!', CANVAS_W / 2, 370);
  }

  ctx.font = '14px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`Wave Reached: ${wave + 1}`, CANVAS_W / 2, 410);

  const blink = Math.sin(gameTime * 0.08) > 0;
  if (blink) {
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.fillText('PRESS SPACE / TAP TO RETRY', CANVAS_W / 2, 480);
  }
}

function drawVictory() {
  ctx.fillStyle = 'rgba(0, 0, 20, 0.7)';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.textAlign = 'center';
  ctx.font = 'bold 32px monospace';
  ctx.fillStyle = '#4f4';
  ctx.fillText('MISSION COMPLETE', CANVAS_W / 2, 250);

  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#4af';
  ctx.fillText('Stars Protected!', CANVAS_W / 2, 290);

  ctx.font = '18px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(`FINAL SCORE: ${Math.floor(score).toLocaleString()}`, CANVAS_W / 2, 350);

  if (score >= highScore) {
    ctx.fillStyle = '#ff4';
    ctx.fillText('NEW HIGH SCORE!', CANVAS_W / 2, 380);
  }

  const blink = Math.sin(gameTime * 0.08) > 0;
  if (blink) {
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.fillText('PRESS SPACE / TAP TO PLAY AGAIN', CANVAS_W / 2, 460);
  }
}

// ============================================================
// Game Reset
// ============================================================
function resetGame() {
  score = 0;
  lives = 3;
  weaponLevel = 1;
  weaponType = 0;
  wave = 0;
  waveTimer = 0;
  bossActive = false;
  boss = null;
  invincibleTimer = 180;
  comboCount = 0;
  comboTimer = 0;
  hitFlashTimer = 0;
  deathAnimTimer = 0;
  player.x = CANVAS_W / 2;
  player.y = CANVAS_H - 100;
  enemies.length = 0;
  enemyBullets.length = 0;
  playerBullets.length = 0;
  powerups.length = 0;
  particles.length = 0;
  gameState = 'playing';
}

// ============================================================
// Main Loop
// ============================================================
function update() {
  gameTime++;
  updateStars();

  if (gameState === 'title') {
    if (keys['Space'] || keys['KeyZ'] || touch.shoot || clickedThisFrame) {
      initAudio();
      resetGame();
    }
  } else if (gameState === 'playing') {
    updatePlayer();
    updatePlayerBullets();
    updateEnemies();
    updateEnemyBullets();
    updateBoss();
    updatePowerups();
    updateParticles();
    checkCollisions();
    updateWaves();
  } else if (gameState === 'gameover' || gameState === 'victory') {
    updateParticles();
    if ((keys['Space'] || keys['KeyZ'] || touch.shoot || clickedThisFrame) && gameTime % 10 === 0) {
      resetGame();
    }
  }
}

function postUpdate() { clickedThisFrame = false; }

function draw() {
  // Screen shake
  ctx.save();
  if (shakeTimer > 0) {
    shakeTimer--;
    ctx.translate((Math.random() - 0.5) * shakeTimer * 2, (Math.random() - 0.5) * shakeTimer * 2);
  }

  // Background
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  drawStars();

  if (gameState === 'title') {
    ctx.restore();
    drawTitle();
    return;
  }

  // Game objects
  drawPowerups();
  drawPlayerBullets();
  drawEnemyBullets();
  drawEnemies();
  drawBoss();
  drawPlayer();
  drawParticles();

  ctx.restore();

  // Red hit flash overlay
  if (hitFlashTimer > 0) {
    hitFlashTimer--;
    ctx.globalAlpha = hitFlashTimer / 15 * 0.4;
    ctx.fillStyle = '#f00';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.globalAlpha = 1;
  }

  drawHUD();

  if (gameState === 'gameover') drawGameOver();
  if (gameState === 'victory') drawVictory();
}

function gameLoop() {
  update();
  postUpdate();
  draw();
  requestAnimationFrame(gameLoop);
}

// Start
loadAssets().then(() => {
  gameLoop();
});
</script>
</body>
</html>
