<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🧩 15パズル ～えらべる絵～</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:linear-gradient(135deg,#fce4ec 0%,#f3e5f5 50%,#e8eaf6 100%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    font-family:'Segoe UI','Hiragino Sans','Meiryo',sans-serif;
    overflow-x:hidden;touch-action:manipulation;padding:8px 0 20px;
  }
  h1{font-size:1.5rem;color:#6a1b9a;margin:4px 0;text-shadow:1px 1px 2px rgba(255,255,255,0.8)}
  .info-bar{display:flex;gap:14px;margin-bottom:6px;font-size:.95rem;color:#4a148c;font-weight:600;flex-wrap:wrap;justify-content:center}
  .info-bar span{background:rgba(255,255,255,0.7);padding:3px 12px;border-radius:20px}
  .picker{display:flex;gap:6px;margin:6px 0 8px;flex-wrap:wrap;justify-content:center}
  .picker button{
    padding:6px 14px;border:2px solid #ce93d8;border-radius:20px;
    background:#fff;font-size:.85rem;font-weight:600;color:#6a1b9a;cursor:pointer;
    transition:all .2s;
  }
  .picker button.active{background:linear-gradient(135deg,#ab47bc,#7b1fa2);color:#fff;border-color:#7b1fa2}
  .picker button:hover{transform:scale(1.05)}
  #board{
    position:relative;border:4px solid #ab47bc;border-radius:12px;overflow:hidden;
    box-shadow:0 8px 32px rgba(106,27,154,0.25);background:#222;
  }
  .tile{
    position:absolute;cursor:pointer;
    transition:left .18s ease,top .18s ease;overflow:hidden;
    border:1px solid rgba(255,255,255,0.25);
  }
  .tile canvas{display:block}
  .tile.empty{opacity:0;pointer-events:none;transition:left .18s ease,top .18s ease,opacity .5s ease}
  .tile.revealed{opacity:1!important;pointer-events:none}
  .tile .num{
    position:absolute;top:3px;left:3px;background:rgba(0,0,0,0.55);color:#fff;
    font-size:13px;font-weight:700;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;pointer-events:none;
  }
  .buttons{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .buttons button{
    padding:8px 18px;border:none;border-radius:30px;font-size:.9rem;font-weight:700;
    cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 12px rgba(0,0,0,0.15);
  }
  .buttons button:active{transform:scale(0.95)}
  .btn-shuffle{background:linear-gradient(135deg,#e91e63,#f06292);color:#fff}
  .btn-peek{background:linear-gradient(135deg,#7e57c2,#b39ddb);color:#fff}
  .btn-toggle{background:linear-gradient(135deg,#26a69a,#80cbc4);color:#fff}
  .hint-text{font-size:.8rem;color:#888;margin-top:4px}
  #overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;
    align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);
  }
  #overlay.show{display:flex}
  .congrats{
    background:linear-gradient(135deg,#fff9c4,#fff176);padding:36px 44px;
    border-radius:24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.3);
    animation:pop .4s ease;max-width:90vw;
  }
  @keyframes pop{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
  .congrats h2{font-size:1.8rem;color:#e65100;margin-bottom:8px}
  .congrats p{font-size:1rem;color:#555;margin-bottom:14px}
  .congrats button{
    padding:10px 26px;border:none;border-radius:30px;
    background:linear-gradient(135deg,#ff6f00,#ffca28);color:#fff;
    font-size:1rem;font-weight:700;cursor:pointer;margin:4px;
  }
  #peek-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;
    align-items:center;justify-content:center;z-index:90;cursor:pointer;
  }
  #peek-overlay.show{display:flex}
  #peek-overlay img{max-width:85vw;max-height:85vh;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
  @keyframes celebrate{
    0%{transform:scale(1)}
    50%{transform:scale(1.02)}
    100%{transform:scale(1)}
  }
  .board-complete{animation:celebrate .6s ease 2;border-color:#ffd600!important}
</style>
</head>
<body>

<h1>🧩 15パズル ～えらべる絵～</h1>

<div class="picker" id="picker"></div>

<div class="info-bar">
  <span>🔢 手数: <b id="moves">0</b></span>
  <span>⏱ <b id="timer">00:00</b></span>
</div>

<div id="board"></div>

<div class="buttons">
  <button class="btn-shuffle" onclick="shuffle()">🔀 シャッフル</button>
  <button class="btn-peek" onclick="peek()">👀 完成図</button>
  <button class="btn-toggle" onclick="toggleNumbers()">🔢 番号ON/OFF</button>
</div>
<p class="hint-text">タイルをタップでスライド！完成すると16枚目が現れるよ✨</p>

<div id="overlay">
  <div class="congrats">
    <h2>🎉 おめでとう！</h2>
    <p id="result-text"></p>
    <button onclick="closeOverlay();shuffle();">もう一回！</button>
    <button onclick="closeOverlay();">絵を眺める</button>
  </div>
</div>

<div id="peek-overlay" onclick="this.classList.remove('show')">
  <img id="peek-img" src="" alt="完成図">
</div>

const GRID = 4;
const TOTAL = GRID * GRID;
let currentImgIdx = 0;
let puzzleImg = new Image();
let tiles = [];
let state = [];
let emptyIdx = TOTAL - 1;
let moveCount = 0;
let timerInterval = null;
let startTime = null;
let solved = false;
let showNumbers = true;

const board = document.getElementById('board');

function getBoardSize(){
  const vw=window.innerWidth;const vh=window.innerHeight;
  const max=Math.min(vw-32,vh-260,480);
  return Math.max(260,max);
}
let boardSize=getBoardSize();
let tileSize=boardSize/GRID;

// Build picker buttons
const picker=document.getElementById('picker');
IMAGES.forEach((img,i)=>{
  const btn=document.createElement('button');
  btn.textContent=img.label;
  btn.onclick=()=>selectImage(i);
  if(i===0)btn.classList.add('active');
  picker.appendChild(btn);
});

function selectImage(idx){
  currentImgIdx=idx;
  picker.querySelectorAll('button').forEach((b,i)=>{
    b.classList.toggle('active',i===idx);
  });
  puzzleImg=new Image();
  puzzleImg.onload=()=>{initBoard();shuffle();};
  puzzleImg.src=IMAGES[idx].src;
}

function initBoard(){
  board.innerHTML='';
  boardSize=getBoardSize();
  tileSize=boardSize/GRID;
  board.style.width=boardSize+'px';
  board.style.height=boardSize+'px';
  board.classList.remove('board-complete');
  tiles=[];

  for(let val=0;val<TOTAL;val++){
    const isBlank=(val===TOTAL-1);
    const el=document.createElement('div');
    el.className='tile'+(isBlank?' empty':'');
    el.style.width=tileSize+'px';
    el.style.height=tileSize+'px';

    // ALL tiles get a canvas (including the 16th hidden one)
    const cv=document.createElement('canvas');
    cv.width=tileSize;cv.height=tileSize;
    const srcRow=Math.floor(val/GRID);
    const srcCol=val%GRID;
    const ctx=cv.getContext('2d');
    ctx.drawImage(puzzleImg,
      srcCol*(puzzleImg.width/GRID),srcRow*(puzzleImg.height/GRID),
      puzzleImg.width/GRID,puzzleImg.height/GRID,
      0,0,tileSize,tileSize);
    el.appendChild(cv);

    if(!isBlank){
      const num=document.createElement('div');
      num.className='num';
      num.textContent=val+1;
      if(!showNumbers)num.style.display='none';
      el.appendChild(num);
    }

    board.appendChild(el);
    tiles.push({el,value:val});
  }

  board.onclick=handleBoardClick;
  board.ontouchend=handleBoardTouch;
  initState();
}

function initState(){
  state=[];
  for(let i=0;i<TOTAL;i++)state.push(i);
  emptyIdx=TOTAL-1;
}

function renderState(){
  for(let pos=0;pos<TOTAL;pos++){
    const val=state[pos];
    const tileObj=tiles[val];
    const row=Math.floor(pos/GRID);
    const col=pos%GRID;
    tileObj.el.style.left=col*tileSize+'px';
    tileObj.el.style.top=row*tileSize+'px';
  }
}

function handleBoardClick(e){
  const rect=board.getBoundingClientRect();
  const col=Math.floor((e.clientX-rect.left)/tileSize);
  const row=Math.floor((e.clientY-rect.top)/tileSize);
  if(col<0||col>=GRID||row<0||row>=GRID)return;
  tryMove(row*GRID+col);
}

function handleBoardTouch(e){
  e.preventDefault();
  if(!e.changedTouches.length)return;
  const t=e.changedTouches[0];
  const rect=board.getBoundingClientRect();
  const col=Math.floor((t.clientX-rect.left)/tileSize);
  const row=Math.floor((t.clientY-rect.top)/tileSize);
  if(col<0||col>=GRID||row<0||row>=GRID)return;
  tryMove(row*GRID+col);
}

function tryMove(pos){
  if(solved)return;
  const eRow=Math.floor(emptyIdx/GRID),eCol=emptyIdx%GRID;
  const tRow=Math.floor(pos/GRID),tCol=pos%GRID;
  if(tRow===eRow){
    if(tCol<eCol){for(let c=eCol-1;c>=tCol;c--)swap(tRow*GRID+c);}
    else{for(let c=eCol+1;c<=tCol;c++)swap(tRow*GRID+c);}
  }else if(tCol===eCol){
    if(tRow<eRow){for(let r=eRow-1;r>=tRow;r--)swap(r*GRID+tCol);}
    else{for(let r=eRow+1;r<=tRow;r++)swap(r*GRID+tCol);}
  }
}

function swap(pos){
  if(!startTime){startTime=Date.now();timerInterval=setInterval(updateTimer,200);}
  const tmp=state[pos];
  state[pos]=state[emptyIdx];
  state[emptyIdx]=tmp;
  emptyIdx=pos;
  moveCount++;
  document.getElementById('moves').textContent=moveCount;
  renderState();
  checkWin();
}

function checkWin(){
  for(let i=0;i<TOTAL-1;i++){if(state[i]!==i)return;}
  solved=true;
  clearInterval(timerInterval);

  // Reveal the 16th tile!
  const blankTile=tiles[TOTAL-1].el;
  blankTile.classList.add('revealed');
  board.classList.add('board-complete');

  // Hide all numbers for clean view
  document.querySelectorAll('.tile .num').forEach(n=>n.style.display='none');

  const elapsed=formatTime(Date.now()-startTime);
  document.getElementById('result-text').textContent=
    moveCount+'手で '+elapsed+' でクリア！\n16枚目が現れた！🎊';
  setTimeout(()=>document.getElementById('overlay').classList.add('show'),800);
}

function formatTime(ms){
  const s=Math.floor(ms/1000),m=Math.floor(s/60),ss=s%60;
  return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function updateTimer(){
  if(!startTime)return;
  document.getElementById('timer').textContent=formatTime(Date.now()-startTime);
}

function shuffle(){
  solved=false;moveCount=0;startTime=null;
  clearInterval(timerInterval);
  document.getElementById('moves').textContent='0';
  document.getElementById('timer').textContent='00:00';
  board.classList.remove('board-complete');

  // Hide the 16th tile again
  tiles[TOTAL-1].el.classList.remove('revealed');
  tiles[TOTAL-1].el.classList.add('empty');

  // Restore numbers
  if(showNumbers){
    document.querySelectorAll('.tile .num').forEach(n=>n.style.display='flex');
  }

  let arr;
  do{
    arr=[];for(let i=0;i<TOTAL;i++)arr.push(i);
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
  }while(!isSolvable(arr));
  state=arr;
  emptyIdx=state.indexOf(TOTAL-1);
  renderState();
}

function isSolvable(arr){
  let inv=0;
  const flat=arr.filter(v=>v!==TOTAL-1);
  for(let i=0;i<flat.length;i++)
    for(let j=i+1;j<flat.length;j++)
      if(flat[i]>flat[j])inv++;
  const blankFromBottom=GRID-1-Math.floor(arr.indexOf(TOTAL-1)/GRID);
  return(inv+blankFromBottom)%2===1;
}

function peek(){
  document.getElementById('peek-img').src=IMAGES[currentImgIdx].src;
  document.getElementById('peek-overlay').classList.add('show');
}
function closeOverlay(){document.getElementById('overlay').classList.remove('show');}

function toggleNumbers(){
  showNumbers=!showNumbers;
  document.querySelectorAll('.tile .num').forEach(n=>{
    n.style.display=showNumbers?'flex':'none';
  });
}

window.addEventListener('resize',()=>{
  boardSize=getBoardSize();tileSize=boardSize/GRID;
  board.style.width=boardSize+'px';board.style.height=boardSize+'px';
  tiles.forEach(t=>{
    t.el.style.width=tileSize+'px';t.el.style.height=tileSize+'px';
    const cv=t.el.querySelector('canvas');
    if(cv){
      cv.width=tileSize;cv.height=tileSize;
      const srcRow=Math.floor(t.value/GRID),srcCol=t.value%GRID;
      const ctx=cv.getContext('2d');
      ctx.drawImage(puzzleImg,
        srcCol*(puzzleImg.width/GRID),srcRow*(puzzleImg.height/GRID),
        puzzleImg.width/GRID,puzzleImg.height/GRID,
        0,0,tileSize,tileSize);
    }
  });
  renderState();
});

// Initial load
selectImage(0);
</script>
