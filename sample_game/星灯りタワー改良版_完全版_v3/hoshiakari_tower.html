<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星灯りタワー ✨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#0d0d2b;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Meiryo','Segoe UI',sans-serif}
canvas{display:block;max-width:100vw;max-height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
// 星灯りタワー - Improved Version
// 改良: 速度を徐々に上げる + デザイン性UP
// ============================================================

const C = document.getElementById('c');
const X = C.getContext('2d');
const W = 360, H = 640;
C.width = W; C.height = H;

function resize() {
  const r = Math.min(innerWidth / W, innerHeight / H);
  C.style.width = Math.floor(W * r) + 'px';
  C.style.height = Math.floor(H * r) + 'px';
}
resize(); addEventListener('resize', resize);

// Audio
let audioCtx;
function sfx(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    if (type === 'place') { o.type='sine'; o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(660,t+0.08); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.12); o.start(t); o.stop(t+0.12); }
    else if (type === 'perfect') { o.type='sine'; o.frequency.setValueAtTime(523,t); o.frequency.setValueAtTime(659,t+0.08); o.frequency.setValueAtTime(784,t+0.16); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.25); o.start(t); o.stop(t+0.25); }
    else if (type === 'miss') { o.type='sawtooth'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(80,t+0.3); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.35); o.start(t); o.stop(t+0.35); }
  } catch(e) {}
}

// State
let state = 'menu';
const COLORS = [
  '#FF6B9D','#7C4DFF','#00BCD4','#FFD740','#FF5722','#66BB6A','#FF80AB','#42A5F5',
  '#E040FB','#FFAB40','#26C6DA','#D4E157','#EF5350','#AB47BC','#29B6F6','#FFA726'
];
let perfectStreak = 0, perfectUntil = 0, offcuts = [];
let blocks, moving, baseY, blockH, speed, score, best, gameOver, gt = 0;
let stars = [], comboText = '', comboAlpha = 0;
let screenFlashColor = '', screenFlashAlpha = 0;  // Screen flash for PERFECT
let shockwaveRadius = 0, shockwaveAlpha = 0, shockwaveX = 0, shockwaveY = 0; // Shockwave ring
let floatingTexts = []; // Floating score/combo text
blockH = 28;
try { best = parseInt(localStorage.getItem('tsm2')) || 0; } catch(e) { best = 0; }

// Background stars
const bgStars = Array.from({length: 80}, () => ({
  x: Math.random() * W, y: Math.random() * H,
  s: 0.5 + Math.random() * 2, b: 0.3 + Math.random() * 0.7,
  sp: 0.1 + Math.random() * 0.3
}));

function reset() {
  blocks = []; offcuts = []; perfectStreak = 0; perfectUntil = 0; stars = [];
  screenFlashAlpha = 0; shockwaveAlpha = 0; floatingTexts = [];
  const startW = 160;
  blocks.push({ x: W/2 - startW/2, w: startW, color: COLORS[0] });
  baseY = H - 60;
  speed = 1.2; // ★ Start SLOW
  score = 0;
  gameOver = false;
  spawnMoving();
}

function spawnMoving() {
  const prev = blocks[blocks.length - 1];
  const w = prev.w;
  const color = COLORS[blocks.length % COLORS.length];
  moving = { x: -w, w: w, dir: 1, color: color };

  // ★ GRADUAL speed increase: starts at 1.2, increments by 0.12 per block, caps at 6
  speed = 1.2 + blocks.length * 0.12;
  if (speed > 6) speed = 6;
}

function spawnStarParticles(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3;
    stars.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 2,
      life: 30 + Math.random() * 20, ml: 50, sz: 2 + Math.random() * 3,
      color: ['#ffe6a0','#ffd740','#fff29c','#ffab40'][Math.floor(Math.random()*4)]
    });
  }
}

function place() {
  if (!moving || gameOver) return;
  const prev = blocks[blocks.length - 1];
  const overlapStart = Math.max(moving.x, prev.x);
  const overlapEnd = Math.min(moving.x + moving.w, prev.x + prev.w);
  let overlapW = overlapEnd - overlapStart;

  if (overlapW <= 0) {
    gameOver = true;
    state = 'over';
    sfx('miss');
    if (score > best) { best = score; try { localStorage.setItem('tsm2', best); } catch(e) {} }
    return;
  }

  let finalStart = overlapStart;

  // Perfect check (within 6px)
  if (Math.abs(moving.x - prev.x) <= 6) {
    perfectStreak++;
    finalStart = prev.x;
    overlapW = Math.min(180, prev.w + (perfectStreak >= 3 ? 8 : 0));
    finalStart = Math.max(0, Math.min(W - overlapW, finalStart));
    perfectUntil = Date.now() + 800;

    // ★ Enhanced PERFECT effects
    const blockY = baseY - blocks.length * blockH;

    if (perfectStreak >= 5) {
      comboText = '🌟 LEGENDARY ×' + perfectStreak;
      screenFlashColor = '#FFD740'; screenFlashAlpha = 0.5;
      spawnStarParticles(W/2, blockY, 30);
      // Shockwave ring
      shockwaveX = W/2; shockwaveY = blockY; shockwaveRadius = 5; shockwaveAlpha = 1;
      sfx('perfect'); sfx('perfect'); // Double chime
    } else if (perfectStreak >= 3) {
      comboText = '✨ PERFECT ×' + perfectStreak + ' 幅回復!';
      screenFlashColor = '#7C4DFF'; screenFlashAlpha = 0.3;
      spawnStarParticles(W/2, blockY, perfectStreak * 5);
      shockwaveX = W/2; shockwaveY = blockY; shockwaveRadius = 5; shockwaveAlpha = 0.8;
      sfx('perfect');
    } else {
      comboText = '⭐ PERFECT ×' + perfectStreak;
      screenFlashColor = '#42A5F5'; screenFlashAlpha = 0.2;
      spawnStarParticles(W/2, blockY, perfectStreak * 4);
      sfx('perfect');
    }
    comboAlpha = 1;

    // Floating text at block position
    floatingTexts.push({ x: W/2, y: blockY - 10, text: perfectStreak >= 5 ? 'LEGENDARY!' : perfectStreak >= 3 ? 'PERFECT!' : 'NICE!', alpha: 1.5, color: perfectStreak >= 5 ? '#FFD740' : perfectStreak >= 3 ? '#E040FB' : '#42A5F5', size: perfectStreak >= 5 ? 28 : perfectStreak >= 3 ? 24 : 18 });
  } else {
    perfectStreak = 0;
    sfx('place');
    // Create falling offcut pieces
    const y = baseY - blocks.length * blockH;
    if (moving.x < finalStart) offcuts.push({ x: moving.x, y, w: finalStart - moving.x, vy: 0, color: moving.color });
    if (moving.x + moving.w > overlapEnd) offcuts.push({ x: overlapEnd, y, w: moving.x + moving.w - overlapEnd, vy: 0, color: moving.color });
  }

  blocks.push({ x: finalStart, w: overlapW, color: moving.color });
  score++;
  moving = null;

  // Scroll camera
  if (blocks.length * blockH > H * 0.6) baseY += blockH;

  spawnMoving();
}

// Input
function onInput(ev) {
  if (ev) ev.preventDefault();
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(err) {}
  if (state === 'menu') { state = 'play'; reset(); return; }
  if (state === 'over') { state = 'play'; reset(); return; }
  place();
}
C.style.touchAction = 'none';
C.tabIndex = 0; C.focus();
C.addEventListener('pointerdown', e => { e.preventDefault(); C.focus(); if (e.isPrimary) onInput(e); });
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); onInput(null); }
}, true);
// Prevent space scrolling
window.addEventListener('keydown', e => { if (e.code === 'Space' || e.key === ' ') e.preventDefault(); }, { passive: false });

// ============================================================
// Drawing
// ============================================================

function drawBg() {
  // Dynamic gradient based on score (changes theme as you go higher)
  const theme = Math.floor((score || 0) / 10) % 6;
  const themes = [
    ['#0D0D2B','#1A1A3E','#2D1B69'],  // Night sky
    ['#173856','#1A2A4E','#2D1B69'],  // Deep ocean
    ['#1B0A3A','#2A1555','#3D1B6E'],  // Purple cosmos
    ['#0A2A2A','#153838','#1B4848'],  // Aurora
    ['#2A1A0A','#3D2810','#4A3520'],  // Sunset
    ['#0D1B2B','#1A2D3E','#2D3B69'],  // Twilight
  ];
  const t = themes[theme];
  const g = X.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, t[0]); g.addColorStop(0.5, t[1]); g.addColorStop(1, t[2]);
  X.fillStyle = g; X.fillRect(0, 0, W, H);

  // Background stars
  gt++;
  bgStars.forEach(s => {
    s.y += s.sp;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    const twinkle = 0.5 + Math.sin(gt * 0.03 + s.x) * 0.5;
    X.fillStyle = `rgba(255,255,200,${s.b * twinkle})`;
    X.fillRect(s.x, s.y, s.s, s.s);
  });

  // Subtle grid lines for depth
  X.strokeStyle = 'rgba(255,255,255,0.03)';
  X.lineWidth = 1;
  for (let y = 0; y < H; y += 40) {
    X.beginPath(); X.moveTo(0, y); X.lineTo(W, y); X.stroke();
  }
}

function drawBlock(x, y, w, h, color, glow) {
  // Shadow
  X.fillStyle = 'rgba(0,0,0,0.3)';
  X.fillRect(x + 3, y + 3, w, h - 2);

  // Main block body
  X.fillStyle = color;
  X.fillRect(x, y, w, h - 2);

  // Top highlight
  X.fillStyle = 'rgba(255,255,255,0.25)';
  X.fillRect(x, y, w, 4);

  // Bottom shadow
  X.fillStyle = 'rgba(0,0,0,0.2)';
  X.fillRect(x, y + h - 4, w, 2);

  // Left edge highlight
  X.fillStyle = 'rgba(255,255,255,0.1)';
  X.fillRect(x, y, 2, h - 2);

  // Right edge shadow
  X.fillStyle = 'rgba(0,0,0,0.15)';
  X.fillRect(x + w - 2, y, 2, h - 2);

  // Glow effect for recently placed
  if (glow) {
    X.shadowColor = color;
    X.shadowBlur = 15;
    X.fillStyle = 'rgba(255,255,255,0.05)';
    X.fillRect(x, y, w, h - 2);
    X.shadowBlur = 0;
  }
}

function drawBlocks() {
  // Falling offcuts
  for (const p of offcuts) {
    p.vy += 0.4; p.y += p.vy;
    X.globalAlpha = Math.max(0, 1 - p.vy / 10);
    drawBlock(p.x, p.y, p.w, blockH, p.color, false);
    X.globalAlpha = 1;
  }
  offcuts = offcuts.filter(p => p.y < H + 40);

  // Stacked blocks
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    const y = baseY - i * blockH;
    if (y < -blockH || y > H + blockH) continue;
    const isRecent = i === blocks.length - 1 && i > 0;
    drawBlock(b.x, y, b.w, blockH, b.color, isRecent);
  }
}

function drawMoving() {
  if (!moving || gameOver) return;
  const y = baseY - blocks.length * blockH;

  // Guide line (shows where previous block is)
  const prev = blocks[blocks.length - 1];
  X.strokeStyle = 'rgba(255,255,255,0.15)';
  X.lineWidth = 1;
  X.setLineDash([4, 4]);
  X.strokeRect(prev.x, y, prev.w, blockH - 2);
  X.setLineDash([]);

  // Moving block with pulse glow
  const pulse = 0.7 + Math.sin(gt * 0.1) * 0.3;
  X.globalAlpha = pulse;
  X.shadowColor = moving.color;
  X.shadowBlur = 12;
  drawBlock(moving.x, y, moving.w, blockH, moving.color, false);
  X.shadowBlur = 0;
  X.globalAlpha = 1;
}

function drawStarParticles() {
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.life--;
    if (s.life <= 0) { stars.splice(i, 1); continue; }
    X.globalAlpha = s.life / s.ml;
    X.fillStyle = s.color;
    // Draw tiny star shape
    X.save();
    X.translate(s.x, s.y);
    X.rotate(gt * 0.1);
    X.beginPath();
    for (let p = 0; p < 10; p++) {
      const a = p * Math.PI / 5 - Math.PI / 2;
      const r = s.sz * (p % 2 ? 0.4 : 1);
      X.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    X.closePath(); X.fill();
    X.restore();
  }
  X.globalAlpha = 1;
}

// ★ Shockwave ring effect
function drawShockwave() {
  if (shockwaveAlpha <= 0) return;
  shockwaveRadius += 6;
  shockwaveAlpha -= 0.025;
  X.save();
  X.globalAlpha = shockwaveAlpha;
  X.strokeStyle = '#fff';
  X.lineWidth = 3;
  X.shadowColor = '#FFD740';
  X.shadowBlur = 15;
  X.beginPath();
  X.arc(shockwaveX, shockwaveY, shockwaveRadius, 0, Math.PI * 2);
  X.stroke();
  // Inner ring
  X.strokeStyle = 'rgba(255,215,64,0.5)';
  X.lineWidth = 1.5;
  X.beginPath();
  X.arc(shockwaveX, shockwaveY, shockwaveRadius * 0.7, 0, Math.PI * 2);
  X.stroke();
  X.shadowBlur = 0;
  X.restore();
}

// ★ Floating text effects
function drawFloatingTexts() {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 1.2;
    ft.alpha -= 0.02;
    if (ft.alpha <= 0) { floatingTexts.splice(i, 1); continue; }
    X.save();
    X.globalAlpha = Math.min(1, ft.alpha);
    X.textAlign = 'center';
    X.font = 'bold ' + ft.size + 'px sans-serif';
    // Text shadow
    X.shadowColor = ft.color;
    X.shadowBlur = 12;
    X.fillStyle = ft.color;
    X.fillText(ft.text, ft.x, ft.y);
    // White outline for readability
    X.shadowBlur = 0;
    X.strokeStyle = 'rgba(255,255,255,0.4)';
    X.lineWidth = 1;
    X.strokeText(ft.text, ft.x, ft.y);
    X.restore();
  }
}

// ★ Screen flash effect
function drawScreenFlash() {
  if (screenFlashAlpha <= 0) return;
  screenFlashAlpha -= 0.03;
  X.save();
  X.globalAlpha = screenFlashAlpha;
  X.fillStyle = screenFlashColor;
  X.fillRect(0, 0, W, H);
  X.restore();
}

function drawHUD() {
  // Score display with stage name
  const stageNames = ['街の灯り','雲の上','星の海','夜明け','宇宙の果て','天の川'];
  const stageName = stageNames[Math.floor(score / 10) % stageNames.length];

  // Score background
  X.fillStyle = 'rgba(0,0,0,0.4)';
  X.fillRect(0, 0, W, 50);
  X.fillStyle = 'rgba(255,255,255,0.05)';
  X.fillRect(0, 48, W, 2);

  X.textAlign = 'center';
  X.font = 'bold 22px sans-serif';
  X.fillStyle = '#FFD740';
  X.fillText(score + '段', W/2 - 40, 32);
  X.font = '14px sans-serif';
  X.fillStyle = '#aaa';
  X.fillText(stageName, W/2 + 50, 32);

  // Best score
  X.textAlign = 'right';
  X.font = '12px sans-serif';
  X.fillStyle = '#666';
  X.fillText('🏆 ' + best, W - 10, 18);

  // Speed indicator
  const speedPct = Math.min(1, (speed - 1.2) / (6 - 1.2));
  const barW = 80;
  X.textAlign = 'left';
  X.font = '10px sans-serif';
  X.fillStyle = '#888';
  X.fillText('SPEED', 10, 18);
  X.fillStyle = 'rgba(255,255,255,0.1)';
  X.fillRect(50, 10, barW, 8);
  const speedColor = speedPct < 0.3 ? '#4CAF50' : speedPct < 0.6 ? '#FFD740' : speedPct < 0.85 ? '#FF9800' : '#F44336';
  X.fillStyle = speedColor;
  X.fillRect(50, 10, barW * speedPct, 8);
  X.strokeStyle = 'rgba(255,255,255,0.15)';
  X.strokeRect(50, 10, barW, 8);

  // Perfect combo display
  if (comboAlpha > 0) {
    comboAlpha -= 0.015;
    X.globalAlpha = comboAlpha;
    X.textAlign = 'center';
    X.font = 'bold 22px sans-serif';
    X.fillStyle = '#fff29c';
    X.shadowColor = '#FFD740';
    X.shadowBlur = 10;
    X.fillText(comboText, W/2, 80);
    X.shadowBlur = 0;
    X.globalAlpha = 1;
  }

  // Width indicator for current block
  if (moving && !gameOver) {
    const widthPct = moving.w / 160;
    X.textAlign = 'center';
    X.font = '10px sans-serif';
    X.fillStyle = widthPct > 0.6 ? '#66BB6A' : widthPct > 0.3 ? '#FFD740' : '#FF5252';
    X.fillText('幅: ' + Math.floor(moving.w) + 'px', W/2, H - 15);
  }
}

function drawMenu() {
  drawBg();
  X.save();
  X.textAlign = 'center'; X.textBaseline = 'middle';

  // Title with glow
  X.shadowColor = '#FFD740';
  X.shadowBlur = 20;
  X.font = 'bold 32px sans-serif';
  X.fillStyle = '#FFD740';
  X.fillText('⭐ 星灯りタワー ⭐', W/2, H * 0.15);
  X.shadowBlur = 0;

  // Decorative tower preview
  const previewColors = ['#FF6B9D','#7C4DFF','#00BCD4','#FFD740','#FF5722','#66BB6A'];
  for (let i = 0; i < 6; i++) {
    const bw = 100 - i * 8;
    const by = H * 0.45 - i * 22;
    const bob = Math.sin(gt * 0.04 + i * 0.5) * 2;
    drawBlock(W/2 - bw/2, by + bob, bw, 20, previewColors[i], i === 5);
  }

  // Instructions
  X.font = '16px sans-serif'; X.fillStyle = '#ccc';
  X.fillText('タップでブロックをおく！', W/2, H * 0.58);
  X.fillText('ぴったり3回で、幅が回復！', W/2, H * 0.63);

  X.font = '13px sans-serif'; X.fillStyle = '#999';
  X.fillText('🎮 スピードは徐々に上がっていく！', W/2, H * 0.70);

  if (best > 0) {
    X.font = '14px sans-serif'; X.fillStyle = '#888';
    X.fillText('🏆 ベスト: ' + best + 'だん', W/2, H * 0.76);
  }

  // Start button with pulse
  const pulse = 0.7 + Math.sin(gt * 0.08) * 0.3;
  X.globalAlpha = pulse;
  X.font = 'bold 20px sans-serif'; X.fillStyle = '#FF80AB';
  X.fillText('タップで開始！', W/2, H * 0.85);
  X.globalAlpha = 1;

  X.restore();
}

function drawGameOver() {
  X.fillStyle = 'rgba(0,0,0,0.7)';
  X.fillRect(0, 0, W, H);

  X.save();
  X.textAlign = 'center'; X.textBaseline = 'middle';

  // Game over text
  X.font = 'bold 28px sans-serif'; X.fillStyle = '#FF5252';
  X.fillText('ゲームオーバー 😢', W/2, H * 0.22);

  // Score display
  X.font = 'bold 24px sans-serif'; X.fillStyle = '#fff';
  X.fillText(score + 'だん つめたよ！', W/2, H * 0.34);

  // Max speed reached
  const maxSpd = Math.min(6, 1.2 + score * 0.12);
  X.font = '14px sans-serif'; X.fillStyle = '#aaa';
  X.fillText('最高速度: ' + maxSpd.toFixed(1) + 'x', W/2, H * 0.41);

  // High score
  if (score >= best && score > 0) {
    X.shadowColor = '#FFD740'; X.shadowBlur = 15;
    X.fillStyle = '#FFD740';
    X.font = 'bold 20px sans-serif';
    X.fillText('🎉 ハイスコア！', W/2, H * 0.50);
    X.shadowBlur = 0;
  }

  X.fillStyle = '#ccc';
  X.font = '15px sans-serif';
  X.fillText('🏆 ベスト: ' + best + 'だん', W/2, H * 0.57);

  // Retry
  const pulse = 0.6 + Math.sin(gt * 0.08) * 0.4;
  X.globalAlpha = pulse;
  X.font = '18px sans-serif'; X.fillStyle = '#FF80AB';
  X.fillText('タップでもう一回！', W/2, H * 0.70);
  X.globalAlpha = 1;

  X.restore();
}

// ============================================================
// Main Loop
// ============================================================
function update() {
  if (state !== 'play' || !moving || gameOver) return;
  moving.x += moving.dir * speed;
  if (moving.x + moving.w > W) { moving.dir = -1; }
  if (moving.x < 0) { moving.dir = 1; }
}

function loop() {
  X.clearRect(0, 0, W, H);
  if (state === 'menu') {
    drawMenu();
  } else if (state === 'play') {
    drawBg(); drawBlocks(); drawMoving(); drawStarParticles(); drawShockwave(); drawFloatingTexts(); drawScreenFlash(); drawHUD();
  } else {
    drawBg(); drawBlocks(); drawStarParticles(); drawShockwave(); drawFloatingTexts(); drawGameOver();
  }
  update();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
