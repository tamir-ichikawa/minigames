<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>こもれび迷宮</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shell.css"><script>window.GAME_CONFIG={"explicitClock":true,"id":"maze","title":"こもれび迷宮","controls":[{"label":"左","code":"ArrowLeft","key":"ArrowLeft"},{"label":"右","code":"ArrowRight","key":"ArrowRight"},{"label":"上","code":"ArrowUp","key":"ArrowUp"},{"label":"下","code":"ArrowDown","key":"ArrowDown"}],"choice":null,"fixed60":false}</script><script src="../../shared/shell.js"></script><script src="../../shared/art.js"></script><link rel="icon" type="image/svg+xml" href="../../shared/favicon.svg"></head>
<body>
<div id="wrap">
  <h1>こもれび迷宮🧭</h1>
  <div class="size-btns">
    <button class="size-btn active" id="s1">かんたん</button>
    <button class="size-btn" id="s2">ふつう</button>
    <button class="size-btn" id="s3">むずかしい</button>
  </div>
  <div class="info">
    <div>歩数: <span id="steps">0</span></div>
    <div>タイム: <span id="timer">0</span>秒</div>
  </div>
  <div class="v2-actions"><button id="hintBtn">次の一歩をヒント</button><button id="newMaze">新しい迷路</button></div><canvas id="c"></canvas>
  <div class="msg" id="msg"></div>
  <div class="controls">
    <div class="dbtn blank"></div>
    <button class="dbtn" id="mu">▲</button>
    <div class="dbtn blank"></div>
    <button class="dbtn" id="ml">◀</button>
    <div class="dbtn blank"></div>
    <button class="dbtn" id="mr">▶</button>
    <div class="dbtn blank"></div>
    <button class="dbtn" id="md">▼</button>
    <div class="dbtn blank"></div>
  </div>
</div>
<script src="../../shared/rules.js"></script><script src="game.js"></script>
</body>
</html>
