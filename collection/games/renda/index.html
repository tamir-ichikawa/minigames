<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>連打チャレンジ</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shell.css"><script>window.GAME_CONFIG={"id":"renda","title":"連打チャレンジ","controls":[],"fixed60":false}</script><script src="../../shared/shell.js"></script><link rel="icon" href="../../shared/favicon.svg"></head>
<body>
<div id="g">
  <div id="titleScreen" class="screen active">
    <h1>連打チャレンジ💥</h1>
    <div style="font-size:55px;margin:12px 0">💥💥</div>
    <p style="font-size:14px;color:#888;margin:8px 20px">ボタンをひたすら連打！<br>何回タップできるかな？</p>
    <div class="mode-btns">
      <button class="mode-btn active" id="m5">5秒</button>
      <button class="mode-btn" id="m10">10秒</button>
      <button class="mode-btn" id="m15">15秒</button>
    </div>
    <button class="btn" id="startBtn">スタート！</button>
  </div>

  <div id="playScreen" class="screen">
    <div class="timer" id="timer">5.0</div>
    <div class="counter" id="count">0</div>
    <div class="gauge" id="gauge">0 タップ/秒</div>
    <div class="bar-wrap"><div class="bar-fill" id="barFill" style="width:100%"></div></div>
    <div class="tap-zone" id="tapZone">
      <div class="big-btn" id="bigBtn">💥</div>
    </div>
  </div>

  <div id="resultScreen" class="screen">
    <div class="result">
      <h2 id="rTitle"></h2>
      <div style="font-size:55px;margin:10px 0" id="rEmoji"></div>
      <p id="rCount" style="font-weight:bold;color:#FF6F00;font-size:28px"></p>
      <p id="rTps" style="font-size:18px;color:#888"></p>
      <p id="rBest" style="font-size:14px;color:#999"></p>
      <button class="btn" id="retryBtn">もういっかい！</button>
      <button class="btn" id="backBtn" style="background:#999">タイトルへ</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
