<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>早押しタップ</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shell.css"><script>window.GAME_CONFIG={"id":"speed_tap","title":"早押しタップ","controls":[],"fixed60":false}</script><script src="../../shared/shell.js"></script><link rel="icon" href="../../shared/favicon.svg"></head>
<body>
<div id="g">
  <div id="titleScreen" class="screen active">
    <h1>早押しタップ⚡</h1>
    <div style="font-size:55px;margin:12px 0">🎯⚡</div>
    <p style="font-size:14px;color:#888;margin:8px 20px;line-height:1.6">ターゲットを素早くタップ！<br>⭐ボーナスターゲットは高得点！<br>💣ボムに触ったらマイナス！<br>コンボで得点UP！</p>
    <div class="mode-btns">
      <button class="mode-btn active" id="m10">10秒</button>
      <button class="mode-btn" id="m20">20秒</button>
      <button class="mode-btn" id="m30">30秒</button>
    </div>
    <button class="btn" id="startBtn">スタート！</button>
  </div>

  <div id="playScreen" class="screen">
    <div class="hud">
      <div>スコア: <span id="score">0</span></div>
      <div>残り: <span id="timeLeft">10</span>秒</div>
    </div>
    <div class="combo-display" id="comboDisplay"></div>
    <div class="play-area" id="zone"></div>
  </div>

  <div id="resultScreen" class="screen">
    <div class="result">
      <h2 id="rTitle"></h2>
      <div style="font-size:55px;margin:10px 0" id="rEmoji"></div>
      <p id="rScore" style="font-weight:bold;color:#FF6F00;font-size:24px"></p>
      <p id="rTaps" style="color:#888"></p>
      <p id="rBest" style="font-size:14px;color:#999"></p>
      <button class="btn" id="retryBtn">もういっかい！</button>
      <button class="btn" id="backBtn" style="background:#999">タイトルへ</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
