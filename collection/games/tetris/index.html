<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>プリズム・ライン</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shell.css"><script>window.GAME_CONFIG={"explicitClock":true,"id":"tetris","title":"プリズム・ライン","controls":[{"label":"左","code":"ArrowLeft","key":"ArrowLeft"},{"label":"右","code":"ArrowRight","key":"ArrowRight"},{"label":"回転","code":"ArrowUp","key":"ArrowUp"},{"label":"下","code":"ArrowDown","key":"ArrowDown"},{"label":"落下","code":"Enter","key":"Enter"}],"choice":null,"fixed60":false}</script><script src="../../shared/shell.js"></script><script src="../../shared/art.js"></script><link rel="icon" type="image/svg+xml" href="../../shared/favicon.svg"></head>
<body>
<div id="wrap">
  <div class="info">
    <div>スコア: <span id="sc">0</span></div>
    <div>ライン: <span id="ln">0</span></div>
    <div>レベル: <span id="lv">1</span></div>
  </div>
  <p class="v2-actions">NEXT <strong id="nextPiece">—</strong></p><canvas id="c"></canvas>
  <div class="controls">
    <button class="cbtn" id="bl">◀</button>
    <button class="cbtn" id="bd">▼</button>
    <button class="cbtn" id="br">▶</button>
    <button class="cbtn" id="brot">↻</button>
    <button class="cbtn wide" id="bdrop">⬇ 落下</button>
  </div>
</div>

<div id="overlay">
  <h2>プリズム・ライン💎</h2>
  <p>ブロックを並べてラインを消そう！</p>
  <button id="startBtn">スタート！</button>
</div>

<script src="../../shared/rules.js"></script><script src="game.js"></script>
</body>
</html>
