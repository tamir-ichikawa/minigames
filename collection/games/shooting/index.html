<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ASTRA PATROL - Protect the Stars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading" role="status"><div>ASTRA PATROL</div><p>機体を準備中…</p><div class="bar"><div class="fill" id="loadbar"></div></div></div>
  <canvas id="game" tabindex="0" aria-label="ゲーム画面。矢印キーで移動、Spaceで発射"></canvas>
  <section id="hangar" hidden aria-label="自機選択">
    <p class="eyebrow">SELECT YOUR SHIP</p><h1>ASTRA <span>PATROL</span></h1>
    <p class="hangar-intro">機体を選んで、星の彼方へ。</p>
    <div id="ship-options" role="group" aria-label="3種類の自機"></div>
    <p id="ship-description" aria-live="polite"></p>
    <button id="launch" type="button">出撃する <span>LAUNCH →</span></button>
    <p class="controls">矢印 / WASD：移動　Space / Z：発射<br>スマートフォン：ドラッグで移動・自動発射</p>
    <p class="credit">ASTRA PATROL / umemura</p>
  </section>
  <div id="round-actions" hidden><button id="retry" type="button">もう一度出撃</button><button id="change-ship" type="button">機体を選び直す</button></div>
  <script src="fleet-data.js"></script>
  <script src="sprite-manifest.js"></script>
  <script src="player-geometry.js"></script>
  <script src="sprite-animation.js"></script>
  <script src="explosions.js"></script>
  <script src="enemy-attacks.js"></script>
  <script src="game.js"></script>
</body>
</html>
