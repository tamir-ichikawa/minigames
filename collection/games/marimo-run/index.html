<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#79dbef">
  <title>モグモグ・ポム</title>
  <link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="../../shared/favicon.svg"></head>
<body>
  <main class="game-shell" id="gameShell" aria-label="モグモグ・ポム">
    <canvas id="gameCanvas" tabindex="0" aria-label="ゲーム画面。クリックで敵を食べ、スペースキーで一時停止します"></canvas>

    <div class="hud" id="hud" hidden aria-live="polite">
      <div class="pill">SCORE <b id="score">0</b></div>
      <div class="pill" id="comboPill">COMBO <b id="combo">0</b></div>
      <div class="fullness-hud" aria-label="満腹ゲージ">
        <div class="fullness-meta"><span>まんぷく <b id="fullnessValue">0</b>%</span><span id="formLabel">ポム</span></div>
        <div class="fullness-track"><i id="fullnessFill"></i></div>
      </div>
      <div class="pill" id="bitePill">空振り <b id="bitesLeft">5</b></div>
      <button class="sound-button" id="soundButton" type="button" aria-label="効果音をオフにする" title="効果音 ON/OFF">♪</button>
    </div>

    <section class="overlay" id="titleScreen" aria-labelledby="titleHeading">
      <div class="card">
        <p class="eyebrow">ONE CLICK ACTION</p>
        <img class="pom-portrait" src="../../assets/characters/marimo-run.svg" width="72" height="72" alt="木の実の精ポム">
        <h1 id="titleHeading"><span>モグモグ・</span>ポム</h1>
        <p class="tagline">空振り5回に気をつけて、3回満腹をめざせ！</p>
        <div class="howto"><span class="mouse" aria-hidden="true"></span><span>画面をクリックして食べよう</span></div>
        <button class="main-button" id="startButton" type="button">START!</button>
        <p class="small-note">クリックで捕食・Spaceで一時停止　<span id="bestTitle">BEST 0</span></p>
      </div>
    </section>

    <section class="overlay hidden" id="gameOverScreen" aria-labelledby="gameOverHeading">
      <div class="card">
        <p class="eyebrow">OH, NO!</p>
        <h2 id="gameOverHeading">たべられちゃった！</h2>
        <p class="score-line">SCORE <b id="finalScore">0</b>　/　BEST <b id="bestScore">0</b></p>
        <p class="new-best" id="newBest">★ NEW BEST! ★</p>
        <button class="main-button" id="retryButton" type="button">RETRY!</button>
        <p class="small-note">今度はもっと早くパクパク！</p>
      </div>
    </section>

    <section class="overlay hidden" id="clearScreen" aria-labelledby="clearHeading">
      <div class="card clear-card">
        <p class="eyebrow">THE BIGGEST BITE!</p>
        <h2 id="clearHeading">GAME CLEAR!</h2>
        <p class="score-line">SCORE <b id="clearScore">0</b>　/　BEST <b id="clearBest">0</b></p>
        <button class="main-button" id="replayButton" type="button">もういちど！</button>
      </div>
    </section>

    <section class="overlay hidden" id="pauseScreen" aria-labelledby="pauseHeading">
      <div class="card pause-card">
        <p class="eyebrow">TAKE A BREAK</p>
        <h2 id="pauseHeading">PAUSE</h2>
        <div class="pause-mark" aria-hidden="true"><i></i><i></i></div>
        <button class="main-button" id="resumeButton" type="button">つづける</button>
        <p class="small-note">Spaceキーでも再開できます</p>
      </div>
    </section>
  </main>

  <script src="controls.js"></script><script src="game.js"></script>
</body>
</html>
