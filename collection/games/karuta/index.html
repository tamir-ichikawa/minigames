<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>季節の絵札帖</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shell.css"><script>window.GAME_CONFIG={"id":"karuta","title":"季節の絵札帖","controls":[{"label":"選択 1","code":"Digit1","choice":0},{"label":"選択 2","code":"Digit2","choice":1},{"label":"選択 3","code":"Digit3","choice":2},{"label":"選択 4","code":"Digit4","choice":3},{"label":"選択 5","code":"Digit5","choice":4},{"label":"選択 6","code":"Digit6","choice":5}],"choice":".card","fixed60":false}</script><script src="../../shared/shell.js"></script><script src="../../shared/art.js"></script><link rel="icon" type="image/svg+xml" href="../../shared/favicon.svg"></head>
<body>
<div id="g">
  <!-- タイトル -->
  <div id="titleScreen" class="screen active">
    <h1>季節の絵札帖🎴</h1>
    <div style="font-size:50px;margin:10px 0">🎴🎴</div>
    <p class="sub">読み札に合うえもじをタップ！</p>
    <p class="sub">はやくとるほど高得点だよ〜！</p>
    <label class="practice"><input id="practice" type="checkbox"> 時間制限なしで練習</label><button class="btn" id="startBtn">はじめる！</button>
  </div>

  <!-- プレイ -->
  <div id="playScreen" class="screen">
    <div class="info">
      <div>ラウンド: <span id="rnd">1</span>/10</div>
      <div>スコア: <span id="sc">0</span></div>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
    <div class="reading">
      <div class="label">よみふだ</div>
      <div class="text" id="readingText"></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="speech" id="speech">はやいもの勝ちだよ〜！🎴</div>
  </div>

  <!-- リザルト -->
  <div id="resultScreen" class="screen">
    <div class="result">
      <h2 id="rTitle"></h2>
      <div style="font-size:50px;margin:10px 0" id="rEmoji"></div>
      <p id="rMsg"></p>
      <p id="rScore" style="font-weight:bold;color:#FF6F00;font-size:18px"></p>
      <button class="btn" id="retryBtn">もういっかい！</button>
      <button class="btn" id="backBtn" style="background:#999">タイトルへ</button>
    </div>
  </div>
</div>
<script src="../../shared/rules.js"></script><script src="data.js"></script><script src="game.js"></script>
</body>
</html>
