<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ひらめき発電所</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shell.css"><script>window.GAME_CONFIG={"id":"anzan","title":"ひらめき発電所","controls":[{"label":"選択 1","code":"Digit1","choice":0},{"label":"選択 2","code":"Digit2","choice":1},{"label":"選択 3","code":"Digit3","choice":2},{"label":"選択 4","code":"Digit4","choice":3}],"choice":".ans","fixed60":false}</script><script src="../../shared/shell.js"></script><script src="../../shared/art.js"></script><link rel="icon" type="image/svg+xml" href="../../shared/favicon.svg"></head>
<body>
<div id="g">
  <div id="titleScreen" class="screen active">
    <h1>ひらめき発電所🔢</h1>
    <div style="font-size:50px;margin:10px 0">⚡🔢</div>
    <p style="font-size:14px;color:#888;margin:6px 20px">正しいこたえをタップしてね〜！</p>
    <p style="font-size:13px;color:#aaa">レベルが上がるとかけ算もでるよ！</p>
    <label class="practice"><input id="practice" type="checkbox"> 時間制限なしで練習</label><button class="btn" id="startBtn">はじめる！</button>
  </div>

  <div id="playScreen" class="screen">
    <div class="info">
      <div>もんだい: <span id="qNum">1</span>/15</div>
      <div>スコア: <span id="sc">0</span></div>
      <div>Lv: <span id="lv">1</span></div>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
    <div class="streak" id="streak"></div>
    <div class="question">
      <div class="expr" id="expr"></div>
      <div class="eq">= ？</div>
    </div>
    <div class="answers" id="answers"></div>
    <div class="speech" id="speech">さんすうがんばろ〜！⚡</div>
  </div>

  <div id="resultScreen" class="screen">
    <div class="result">
      <h2 id="rTitle"></h2>
      <div style="font-size:50px;margin:10px 0" id="rEmoji"></div>
      <p id="rMsg"></p>
      <p id="rScore" style="font-weight:bold;color:#FF6F00;font-size:18px"></p>
      <p id="rDetail" style="font-size:14px;color:#999"></p>
      <button class="btn" id="retryBtn">もういっかい！</button>
    </div>
  </div>
</div>
<script src="../../shared/rules.js"></script><script src="game.js"></script>
</body>
</html>
