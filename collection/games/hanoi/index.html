<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ハノイの塔</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/shell.css"><script>window.GAME_CONFIG={"id":"hanoi","title":"ハノイの塔","controls":[],"fixed60":false}</script><script src="../../shared/shell.js"></script><link rel="icon" href="../../shared/favicon.svg"></head>
<body>
<div id="g">
  <div id="titleScreen" class="screen active">
    <h1>ハノイの塔🗼</h1>
    <div style="font-size:50px;margin:12px 0">🗼🗼</div>
    <p style="font-size:14px;color:#888;margin:8px 20px;line-height:1.6">円盤を1枚ずつ移動して<br>右の棒に全部積み直そう！<br>大きい円盤の上に小さい円盤しか置けないよ</p>
    <div class="diff-btns">
      <button class="diff-btn active" id="d3">3枚</button>
      <button class="diff-btn" id="d4">4枚</button>
      <button class="diff-btn" id="d5">5枚</button>
    </div>
    <button class="btn" id="startBtn">スタート！</button>
  </div>

  <div id="playScreen" class="screen">
    <div class="info">
      <div>手数: <span id="moves">0</span></div>
      <div>最小: <span id="minMoves">7</span></div>
    </div>
    <canvas id="c" width="360" height="280"></canvas>
    <div class="speech" id="speech">柱をタップして円盤を移動してね〜！🗼</div>
    <button class="btn" id="resetBtn" style="background:#999;font-size:14px;padding:6px 16px">リセット</button>
  </div>

  <div id="resultScreen" class="screen">
    <div class="result">
      <h2 id="rTitle"></h2>
      <div style="font-size:50px;margin:10px 0" id="rEmoji"></div>
      <p id="rMsg"></p>
      <p id="rMoves" style="font-weight:bold;color:#2E7D32;font-size:20px"></p>
      <button class="btn" id="retryBtn">もういっかい！</button>
      <button class="btn" id="backBtn" style="background:#999">タイトルへ</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
