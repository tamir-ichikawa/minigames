<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ff9b54">
  <title>GOAT JUMP</title>
  <link rel="stylesheet" href="styles/sky-jump.css">
</head>
<body>
  <a class="back-link" href="index.html" aria-label="ゲーム一覧へ戻る">← ゲーム一覧</a>
  <main class="game-shell" aria-label="GOAT JUMP">
    <canvas id="game" aria-label="右へ進みながら動く足場を登るジャンプゲーム"></canvas>
    <section class="hud" id="hud" hidden aria-live="polite">
      <div class="hud-card hud-stage"><span class="hud-label">STAGE</span><strong id="stage-value">1</strong></div>
      <div class="hud-card hud-progress">
        <div class="hud-row"><span class="hud-label">GOAL</span><strong><span id="climb-value">0</span>/<span id="goal-value">10</span></strong></div>
        <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
      </div>
      <div class="hud-card hud-time" id="time-card"><span class="hud-label">TIME</span><strong id="time-value">30.0</strong></div>
      <div class="combo" id="combo" hidden>COMBO ×2</div>
    </section>
    <div class="toast" id="toast" hidden></div>
    <section class="panel" id="start-screen">
      <div class="panel-card hero-card">
        <p class="eyebrow">ONE TAP SKY ACTION</p>
        <h1>GOAT <span>JUMP</span></h1>
        <p class="lead">動く足場をつないで、制限時間内にゴールへ。<br>タイミングよく右へ駆け上がろう！</p>
        <div class="mission-preview"><span>STAGE 1</span><strong>30秒で 10本 登る</strong></div>
        <button class="primary-button" id="start-btn" type="button">ジャンプ開始</button>
        <p class="controls">タップ / クリック / Space：ジャンプ　<span>空中でも1回OK</span></p>
      </div>
    </section>
    <section class="panel" id="result-screen" hidden>
      <div class="panel-card result-card">
        <p class="eyebrow" id="result-kicker">TRY AGAIN</p>
        <h2 id="result-title">ゲームオーバー</h2>
        <div class="result-score"><strong id="result-value">0</strong><span>本</span></div>
        <p id="result-message">あと少し！もう一度挑戦しよう。</p>
        <div class="result-meta"><span>BEST <strong id="best-value">0</strong></span><span>COMBO <strong id="best-combo-value">0</strong></span></div>
        <button class="primary-button" id="next-btn" type="button">もう一度</button>
      </div>
    </section>
    <noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
  </main>
  <script src="scripts/sky-jump.js" defer></script>
</body>
</html>
